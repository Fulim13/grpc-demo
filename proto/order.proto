syntax = "proto3";

// package    =  /order.v1.Order/Create instead of Order/Create where v2 cannot use v2
package order.v1;

// go_package = where .go files land + Go import path  (module in protoc = strips the prefix)
option go_package = "github.com/Fulim13/grpc-demo/gen/golang/v1/order";

message CreateOrderRequest {
	int64 user_id = 1;
	repeated OrderItem order_items = 2;
}

message OrderItem {
	string product_code = 1;
	float unit_price = 2;
	int32 quantity = 3;
}

message CreateOrderResponse {
	int64 order_id = 1;
}

message GetOrderRequest {
	int64 order_id = 1;
}

message GetOrderResponse {
	int64 user_id = 1;
	repeated OrderItem order_items = 2;
}

service Order {
	rpc Create(CreateOrderRequest) returns (CreateOrderResponse){}
}
